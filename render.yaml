services:
  - type: web
    name: ai-pulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_MODE
        value: live
      - key: LLM_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
